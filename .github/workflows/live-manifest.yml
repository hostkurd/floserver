name: Live runtime list

# Checks the signed runtime list that users download from cdn.floserver.org,
# exactly as FloServer will, every day. A failure here means users can't
# install runtimes (or soon won't): see docs/manifest.md.

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 08:17 Baghdad time
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/live-manifest.yml"
      - "src/core/**"
      - "tools/manifest-tool/**"

permissions:
  contents: read

jobs:
  check:
    name: Live runtime list on cdn.floserver.org
    runs-on: ubuntu-24.04
    env:
      CDN: https://cdn.floserver.org
      WARN_DAYS: 14
    steps:
      - uses: actions/checkout@v4
      - name: Build floserver-manifest
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build jq
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFLOSERVER_BUILD_TESTS=OFF
          cmake --build build --target floserver_manifest
      - name: Download the list and its signature
        run: |
          curl -fsS --retry 3 -o manifest.json "$CDN/manifest.json"
          curl -fsS --retry 3 -o manifest.json.sig "$CDN/manifest.json.sig"
      - name: Verify with FloServer's built-in key
        run: ./build/tools/manifest-tool/floserver-manifest verify manifest.json
      - name: Check it isn't about to expire
        run: |
          expires=$(jq -r .expires manifest.json)
          left=$(( ($(date -u -d "$expires" +%s) - $(date -u +%s)) / 86400 ))
          echo "Sequence $(jq -r .sequence manifest.json), expires $expires ($left days left)"
          if [ "$left" -lt "$WARN_DAYS" ]; then
            echo "::error title=Runtime list expires soon::It expires on $expires ($left days left). Build it with the next sequence number, sign it offline and upload it (docs/manifest.md)."
            exit 1
          fi
      - name: Check every runtime is on the CDN with the listed size
        run: |
          fail=0
          while read -r url size; do
            got=$(curl -fsSI --retry 3 "$url" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}' | tail -1)
            if [ "$got" != "$size" ]; then
              echo "::error title=CDN file missing or changed::$url has size '${got:-none}', the list says $size"
              fail=1
            else
              echo "OK  $url"
            fi
          done < <(jq -r '.runtimes[] | "\(.urls[0]) \(.size)"' manifest.json)
          exit $fail
      - name: Check two small runtimes byte for byte
        run: |
          fail=0
          for name in composer nginx; do
            read -r url sha < <(jq -r --arg n "$name" '[.runtimes[] | select(.name==$n)][0] | "\(.urls[0]) \(.sha256)"' manifest.json)
            curl -fsS --retry 3 -o file.bin "$url"
            got=$(sha256sum file.bin | cut -d' ' -f1)
            if [ "$got" != "$sha" ]; then
              echo "::error title=CDN file differs::$url has SHA-256 $got, the list says $sha"
              fail=1
            else
              echo "OK  $url ($got)"
            fi
          done
          exit $fail
