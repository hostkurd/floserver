name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # No -G: the runner's newest Visual Studio, so an image update can't
      # break the build. Debug as well as Release so asserts and checked
      # iterators run in the tests.
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build (Debug)
        shell: pwsh
        run: |
          cmake --build build --config Debug 2>&1 | Tee-Object -FilePath build-debug.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Show compiler errors as annotations
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build-debug.log) {
            Select-String -Path build-debug.log -Pattern ': (fatal )?error [A-Z]+[0-9]+|: warning C[0-9]+' |
              Select-Object -First 30 |
              ForEach-Object { "::error title=MSVC::$($_.Line.Trim())" }
          }
      - name: Test (Debug)
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Show failed tests as annotations
        if: failure()
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter floserver_tests.exe | Select-Object -First 1
          & $exe.FullName 2>&1 | Select-String 'TEST CASE|ERROR|FATAL|values:|logged:' |
            ForEach-Object { "::error title=floserver_tests::$($_.Line.Trim())" }
      - name: Build (Release)
        run: cmake --build build --config Release
      - name: Test (Release)
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Report sizes
        shell: pwsh
        run: |
          Get-ChildItem build -Recurse -Include FloServer.exe,floserverd.exe,floserver.exe |
            Where-Object { $_.FullName -match '\\Release\\' } |
            ForEach-Object { "{0,-16} {1,10:N0} bytes" -f $_.Name, $_.Length }
          "vcruntime/:"
          Get-ChildItem build/bin/Release/vcruntime | ForEach-Object { "  {0,-28} {1,10:N0} bytes" -f $_.Name, $_.Length }
      # Real downloads from cdn.floserver.org through WinHTTP, into a
      # throwaway data folder: the signed list, then nginx (a zip that needs
      # the VC++ DLLs, so `nginx -v` proves they were added) and Composer (a
      # plain file).
      - name: Install runtimes from the live CDN
        shell: pwsh
        env:
          FLOSERVER_DATA_DIR: ${{ runner.temp }}\floserver-data
          FLOSERVER_INSTANCE: ci
        run: |
          $bin = "build/bin/Release"
          & "$bin/flo.exe" runtimes
          if ($LASTEXITCODE -ne 0) { throw "flo runtimes failed" }
          & "$bin/flo.exe" install nginx
          if ($LASTEXITCODE -ne 0) { throw "flo install nginx failed" }
          & "$bin/flo.exe" install composer
          if ($LASTEXITCODE -ne 0) { throw "flo install composer failed" }
          $nginx = Get-ChildItem "$env:FLOSERVER_DATA_DIR/runtimes/nginx" -Directory | Select-Object -First 1
          Get-ChildItem $nginx.FullName -Filter *.dll | ForEach-Object { "  " + $_.Name }
          & "$($nginx.FullName)/nginx.exe" -v
          if ($LASTEXITCODE -ne 0) { throw "the installed nginx doesn't start" }
          if (-not (Test-Path "$env:FLOSERVER_DATA_DIR/runtimes/composer/*/composer.phar")) { throw "composer.phar missing" }
          & "$bin/flo.exe" runtimes
          & "$bin/flo.exe" service stop
      - name: Show the service's view on failure
        if: failure()
        shell: pwsh
        env:
          FLOSERVER_DATA_DIR: ${{ runner.temp }}\floserver-data
        run: |
          Get-ChildItem -Recurse $env:FLOSERVER_DATA_DIR -ErrorAction SilentlyContinue |
            ForEach-Object { "::error title=data folder::$($_.FullName)" }
      # The build, for trying on a real PC: download it from the run's page.
      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FloServer-windows-x64-${{ github.sha }}
          path: |
            build/bin/Release/*.exe
            build/bin/Release/vcruntime/*.dll
          retention-days: 14

  linux-sanitizers:
    name: Linux (clang, ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DFLOSERVER_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-release:
    name: Linux (GCC, release)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # Optimised builds turn on warnings the debug builds don't (FORTIFY).
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 clang-tidy-18
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DFLOSERVER_CLANG_TIDY=ON
      - name: Build with clang-tidy
        run: cmake --build build

  windows-cross:
    name: Windows code builds with MinGW
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build mingw-w64
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake
      - name: Build
        run: cmake --build build
