name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Debug and Release run side by side. Debug so asserts and checked
  # iterators run in the tests; Release is the build people try and the one
  # that installs from the live CDN.
  windows-debug:
    name: Windows (MSVC, Debug)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # No -G: the runner's newest Visual Studio, so an image update can't
      # break the build.
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build (Debug)
        shell: pwsh
        run: |
          cmake --build build --config Debug --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Show compiler errors as annotations
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Select-String -Path build.log -Pattern ': (fatal )?error [A-Z]+[0-9]+|: warning C[0-9]+' |
              Select-Object -First 30 |
              ForEach-Object { "::error title=MSVC::$($_.Line.Trim())" }
          }
      - name: Test (Debug)
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Show failed tests as annotations
        if: failure()
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter floserver_tests.exe | Select-Object -First 1
          & $exe.FullName 2>&1 | Select-String 'TEST CASE|ERROR|FATAL|values:|logged:' |
            ForEach-Object { "::error title=floserver_tests::$($_.Line.Trim())" }

  windows:
    name: Windows (MSVC, Release)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Show compiler errors as annotations
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Select-String -Path build.log -Pattern ': (fatal )?error [A-Z]+[0-9]+|: warning C[0-9]+' |
              Select-Object -First 30 |
              ForEach-Object { "::error title=MSVC::$($_.Line.Trim())" }
          }
      - name: Test (Release)
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Show failed tests as annotations
        if: failure()
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter floserver_tests.exe | Select-Object -First 1
          & $exe.FullName 2>&1 | Select-String 'TEST CASE|ERROR|FATAL|values:|logged:' |
            ForEach-Object { "::error title=floserver_tests::$($_.Line.Trim())" }
      - name: Report sizes
        shell: pwsh
        run: |
          Get-ChildItem build -Recurse -Include FloServer.exe,floserverd.exe,floserver.exe |
            Where-Object { $_.FullName -match '\\Release\\' } |
            ForEach-Object { "{0,-16} {1,10:N0} bytes" -f $_.Name, $_.Length }
          "vcruntime/:"
          Get-ChildItem build/bin/Release/vcruntime | ForEach-Object { "  {0,-28} {1,10:N0} bytes" -f $_.Name, $_.Length }
      # Real downloads from cdn.floserver.org through WinHTTP, into a
      # throwaway data folder: the signed list, then nginx (a zip that needs
      # the VC++ DLLs, so `nginx -v` proves they were added), Composer (a
      # plain file) and PHP, then a project run end to end.
      - name: Install runtimes and run a project from the live CDN
        shell: pwsh
        env:
          FLOSERVER_DATA_DIR: ${{ runner.temp }}\floserver-data
          FLOSERVER_INSTANCE: ci
          FLOSERVER_WEB_PORTS: "18080,18443"
          FLOSERVER_IDLE_SECONDS: "3"
        run: |
          $bin = "build/bin/Release"
          # Native programs write to stderr (nginx -v does); that isn't an error here.
          $ErrorActionPreference = "Continue"
          trap {
            Write-Host "::error title=live install::script error at line $($_.InvocationInfo.ScriptLineNumber): $($_.Exception.Message)"
            exit 1
          }
          # Logs can't be read from outside, so every failure becomes an annotation.
          function Fail([string]$what, [string]$output) {
            $flat = ($output -replace "`r?`n", " | ").Trim()
            if ($flat.Length -gt 3000) { $flat = $flat.Substring(0, 3000) }
            Write-Host "::error title=live install::$what :: $flat"
            exit 1
          }
          # What the service, nginx and PHP say, for a failure annotation.
          function Diagnostics() {
            $logs = "$env:FLOSERVER_DATA_DIR\web\logs"
            $out = (& "$bin/flo.exe" projects 2>&1 | Out-String)
            Get-ChildItem $logs -File -ErrorAction SilentlyContinue | ForEach-Object {
              $tail = (Get-Content $_.FullName -Tail 5 -ErrorAction SilentlyContinue) -join " / "
              if ($tail) { $out += " || $($_.Name): $tail" }
            }
            $procs = (Get-Process nginx, php-cgi, node -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name):$($_.Id)" }) -join ","
            return "$out || processes: $procs"
          }
          function Run([string]$what, [scriptblock]$block) {
            $out = & $block 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) { Fail "$what (exit $LASTEXITCODE)" $out }
            return $out
          }
          Run "flo runtimes" { & "$bin/flo.exe" runtimes } | Out-Null
          Run "flo install nginx" { & "$bin/flo.exe" install nginx } | Out-Null
          Run "flo install composer" { & "$bin/flo.exe" install composer } | Out-Null
          $nginx = Get-ChildItem "$env:FLOSERVER_DATA_DIR/runtimes/nginx" -Directory | Select-Object -First 1
          $files = (Get-ChildItem $nginx.FullName -File | ForEach-Object Name) -join ", "
          "nginx folder: $files"
          Run "installed nginx -v (files: $files)" { & "$($nginx.FullName)/nginx.exe" -v } | Out-Null
          $phar = Get-ChildItem "$env:FLOSERVER_DATA_DIR/runtimes/composer" -Recurse -Filter composer.phar
          if (-not $phar) {
            $all = (Get-ChildItem "$env:FLOSERVER_DATA_DIR/runtimes/composer" -Recurse | ForEach-Object Name) -join ", "
            Fail "composer.phar missing" $all
          }
          Run "flo runtimes" { & "$bin/flo.exe" runtimes } | Out-Null
          Run "flo uninstall" { & "$bin/flo.exe" uninstall composer $phar.Directory.Name } | Out-Null

          # A project served by the real nginx and php-cgi from the CDN:
          # serve, fall asleep, wake on a burst (Q1 on Windows: php-cgi gets
          # the held socket as stdin, and only that handle).
          Run "flo install php 8.5" { & "$bin/flo.exe" install php 8.5 } | Out-Null
          $site = "$env:RUNNER_TEMP\ci-shop"
          New-Item -ItemType Directory -Force "$site\public" | Out-Null
          Set-Content "$site\public\index.php" '<?php echo "shop ", PHP_VERSION, " ", $_SERVER["REQUEST_URI"];'
          Set-Content "$site\floserver.json" '{ "php": "8.5", "root": "public", "extensions": ["intl"] }'
          Run "flo add" { & "$bin/flo.exe" add $site } | Out-Null
          Run "flo start shop" { & "$bin/flo.exe" start ci-shop } | Out-Null
          $url = "http://ci-shop.localhost:18080"
          $resolve = "ci-shop.localhost:18080:127.0.0.1"
          $body = (& curl.exe -s --max-time 20 --resolve $resolve "$url/cart?x=1" | Out-String).Trim()
          if ($body -notlike "shop 8.5.* /cart?x=1") {
            Fail "first request (got '$body')" (Diagnostics)
          }
          $awake = (& "$bin/flo.exe" projects | Out-String)
          if ($awake -notmatch "on, running") { Fail "pool not running after a request" $awake }
          Start-Sleep -Seconds 8   # FLOSERVER_IDLE_SECONDS is 3
          $asleep = (& "$bin/flo.exe" projects | Out-String)
          $phpLeft = @(Get-Process php-cgi -ErrorAction SilentlyContinue).Count
          if ($asleep -notmatch "on, asleep" -or $phpLeft -ne 0) { Fail "pool didn't sleep ($phpLeft php-cgi left)" (Diagnostics) }
          # 20 requests at once while it wakes: every one is served.
          # -o applies to one URL each, so every URL gets its own.
          $targets = 1..20 | ForEach-Object { "-o"; "NUL"; "$url/burst/$_" }
          $codes = & curl.exe -s --max-time 30 --parallel --parallel-immediate --parallel-max 20 -w "%{http_code}`n" --resolve $resolve $targets
          $good = @($codes | Where-Object { $_ -eq "200" }).Count
          if ($good -ne 20) { Fail "burst while waking: $good of 20 OK ($($codes -join " "))" (Diagnostics) }
          # A second project with its own pool, added while the first runs:
          # nginx reloads (-s reload) and both are served.
          $blog = "$env:RUNNER_TEMP\\ci-blog"
          New-Item -ItemType Directory -Force $blog | Out-Null
          Set-Content "$blog\\index.php" '<?php echo "blog ", extension_loaded("intl") ? "intl" : "no-intl";'
          Set-Content "$blog\\floserver.json" '{ "php": "8.5" }'
          Run "flo add blog" { & "$bin/flo.exe" add $blog } | Out-Null
          Run "flo start blog" { & "$bin/flo.exe" start ci-blog } | Out-Null
          $blogBody = (& curl.exe -s --max-time 20 --resolve "ci-blog.localhost:18080:127.0.0.1" "http://ci-blog.localhost:18080/" | Out-String).Trim()
          $shopBody = (& curl.exe -sS --max-time 20 -w " [status %{http_code}]" --resolve $resolve "$url/again" 2>&1 | Out-String).Trim()
          $shopExit = $LASTEXITCODE
          if ($blogBody -ne "blog intl" -or $shopBody -notlike "shop 8.5.* /again*") {
            Fail "after a reload (blog '$blogBody', shop '$shopBody' curl exit $shopExit)" (Diagnostics)
          }
          # A Node project (D11): its own server, started by the first
          # request through nginx and the service's relay, asleep when idle.
          Run "flo install node 24" { & "$bin/flo.exe" install node 24 } | Out-Null
          $web = "$env:RUNNER_TEMP\ci-web"
          New-Item -ItemType Directory -Force $web | Out-Null
          Set-Content "$web\package.json" '{ "name": "ci-web", "private": true, "scripts": { "dev": "node server.js" } }'
          Set-Content "$web\server.js" 'require("http").createServer((q, r) => r.end("node " + process.version + " " + q.url)).listen(Number(process.env.PORT), process.env.HOST);'
          Set-Content "$web\floserver.json" '{ "node": "24" }'
          Run "flo add web" { & "$bin/flo.exe" add $web } | Out-Null
          Run "flo start web" { & "$bin/flo.exe" start ci-web } | Out-Null
          $webResolve = "ci-web.localhost:18080:127.0.0.1"
          $webBody = (& curl.exe -sS --max-time 60 --resolve $webResolve "http://ci-web.localhost:18080/hello" 2>&1 | Out-String).Trim()
          if ($webBody -notlike "node v24.* /hello") {
            $log = (Get-Content "$env:FLOSERVER_DATA_DIR\web\apps\ci-web.log" -Tail 20 -ErrorAction SilentlyContinue) -join " / "
            Fail "Node project (got '$webBody')" "$(Diagnostics) || app log: $log"
          }
          # nginx lets its kept-alive connections go after 10 s; then the idle time (3 s).
          $slept = $false
          for ($i = 0; $i -lt 30 -and -not $slept; $i++) {
            Start-Sleep -Seconds 1
            $slept = (& "$bin/flo.exe" projects | Out-String) -match "ci-web\s+node 24\S*\s+on, asleep"
          }
          if (-not $slept -or @(Get-Process node -ErrorAction SilentlyContinue).Count -ne 0) {
            Fail "Node project didn't sleep" (Diagnostics)
          }
          $webBody = (& curl.exe -sS --max-time 60 --resolve $webResolve "http://ci-web.localhost:18080/again" 2>&1 | Out-String).Trim()
          if ($webBody -notlike "node v24.* /again") { Fail "Node project after sleeping (got '$webBody')" (Diagnostics) }
          Run "flo stop" { & "$bin/flo.exe" stop } | Out-Null
          Start-Sleep -Seconds 1
          $left = @(Get-Process nginx, php-cgi, node -ErrorAction SilentlyContinue).Count
          if ($left -ne 0) { Fail "processes left after flo stop" (Diagnostics) }
          "::notice title=live install::nginx, Composer, PHP and Node installed from the CDN; a project served, slept and woke for 20 requests at once; a second pool added with a reload; a Node project served, slept and woke"
          exit 0
      # The build, for trying on a real PC: download it from the run's page.
      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FloServer-windows-x64-${{ github.sha }}
          path: |
            build/bin/Release/*.exe
            build/bin/Release/vcruntime/*.dll
          retention-days: 14

  linux-sanitizers:
    name: Linux (clang, ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev libssl-dev nginx-core php-cgi mariadb-server && (sudo systemctl stop mariadb || true)
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DFLOSERVER_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee test.log
      # Job logs can't be read from every place the team works; the
      # failing lines become annotations on the run.
      - name: Show failed tests as annotations
        if: failure()
        shell: bash
        run: |
          grep -E 'TEST CASE|ERROR|FATAL|values:|logged:|runtime error|Sanitizer|SUMMARY' test.log | head -40 |
            while IFS= read -r line; do echo "::error title=floserver_tests::${line}"; done

  linux-release:
    name: Linux (GCC, release)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev nginx-core php-cgi mariadb-server && (sudo systemctl stop mariadb || true)
      # Optimised builds turn on warnings the debug builds don't (FORTIFY).
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee test.log
      # Job logs can't be read from every place the team works; the
      # failing lines become annotations on the run.
      - name: Show failed tests as annotations
        if: failure()
        shell: bash
        run: |
          grep -E 'TEST CASE|ERROR|FATAL|values:|logged:|runtime error|Sanitizer|SUMMARY' test.log | head -40 |
            while IFS= read -r line; do echo "::error title=floserver_tests::${line}"; done

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 clang-tidy-18 libssl-dev
      # Files whose preprocessed source, checks and clang-tidy version are
      # unchanged since they last passed aren't checked again
      # (tools/ci/clang_tidy_cache.py). Each run saves its own cache and
      # starts from the newest one this branch or main can see.
      - name: Restore clang-tidy passes
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/clang-tidy-cache
          key: clang-tidy-18-${{ github.sha }}
          restore-keys: clang-tidy-18-
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DFLOSERVER_CLANG_TIDY=ON -DFLOSERVER_CLANG_TIDY_CACHE=ON
      - name: Build with clang-tidy
        env:
          FLOSERVER_CLANG_TIDY_CACHE_DIR: ${{ runner.temp }}/clang-tidy-cache
        run: |
          mkdir -p "$FLOSERVER_CLANG_TIDY_CACHE_DIR"
          find "$FLOSERVER_CLANG_TIDY_CACHE_DIR" -type f -mtime +14 -delete
          cmake --build build
          echo "clang-tidy cache: $(find "$FLOSERVER_CLANG_TIDY_CACHE_DIR" -type f | wc -l) passing files"
      # Saved after a failure too: a marker only ever means "passed".
      - name: Save clang-tidy passes
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/clang-tidy-cache
          key: clang-tidy-18-${{ github.sha }}

  windows-cross:
    name: Windows code builds with MinGW
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build mingw-w64
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake
      - name: Build
        run: cmake --build build
