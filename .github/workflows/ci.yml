name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Debug and Release run side by side. Debug so asserts and checked
  # iterators run in the tests; Release is the build people try and the one
  # that installs from the live CDN.
  windows-debug:
    name: Windows (MSVC, Debug)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # No -G: the runner's newest Visual Studio, so an image update can't
      # break the build.
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build (Debug)
        shell: pwsh
        run: |
          cmake --build build --config Debug --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Show compiler errors as annotations
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Select-String -Path build.log -Pattern ': (fatal )?error [A-Z]+[0-9]+|: warning C[0-9]+' |
              Select-Object -First 30 |
              ForEach-Object { "::error title=MSVC::$($_.Line.Trim())" }
          }
      - name: Test (Debug)
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Show failed tests as annotations
        if: failure()
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter floserver_tests.exe | Select-Object -First 1
          & $exe.FullName 2>&1 | Select-String 'TEST CASE|ERROR|FATAL|values:|logged:' |
            ForEach-Object { "::error title=floserver_tests::$($_.Line.Trim())" }

  windows:
    name: Windows (MSVC, Release)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Show compiler errors as annotations
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Select-String -Path build.log -Pattern ': (fatal )?error [A-Z]+[0-9]+|: warning C[0-9]+' |
              Select-Object -First 30 |
              ForEach-Object { "::error title=MSVC::$($_.Line.Trim())" }
          }
      - name: Test (Release)
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Show failed tests as annotations
        if: failure()
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter floserver_tests.exe | Select-Object -First 1
          & $exe.FullName 2>&1 | Select-String 'TEST CASE|ERROR|FATAL|values:|logged:' |
            ForEach-Object { "::error title=floserver_tests::$($_.Line.Trim())" }
      - name: Report sizes
        shell: pwsh
        run: |
          Get-ChildItem build -Recurse -Include FloServer.exe,floserverd.exe,flo.exe,floserver-setup.dll |
            Where-Object { $_.FullName -match '\\Release\\' } |
            ForEach-Object { "{0,-20} {1,10:N0} bytes" -f $_.Name, $_.Length }
          "Visual C++ runtime:"
          Get-ChildItem build/bin/Release -Filter *.dll | Where-Object { $_.Name -ne 'floserver-setup.dll' } |
            ForEach-Object { "  {0,-28} {1,10:N0} bytes" -f $_.Name, $_.Length }
      # D15: the service's memory with nothing running, and the window's
      # memory and time to its first paint (FloServer.exe --measure, the
      # median of three starts). Over a budget fails the PR; the numbers are
      # in src/ui-win32/model/start_measure.h too.
      - name: Check memory and start-time budgets (D15)
        shell: pwsh
        env:
          FLOSERVER_DATA_DIR: ${{ runner.temp }}\floserver-budgets
          FLOSERVER_INSTANCE: budgets
          FLOSERVER_WEB_PORTS: "18180,18543"
          FLOSERVER_UPDATE_DELAY: "3600"  # no update check while it's measured
        run: |
          $bin = "build/bin/Release"
          $ErrorActionPreference = "Continue"
          trap {
            Write-Host "::error title=Budgets::script error at line $($_.InvocationInfo.ScriptLineNumber): $($_.Exception.Message)"
            & "$bin/flo.exe" service stop 2>&1 | Out-Null
            exit 1
          }
          function Fail([string]$what, [string]$output) {
            $flat = ($output -replace "`r?`n", " | ").Trim()
            if ($flat.Length -gt 3000) { $flat = $flat.Substring(0, 3000) }
            Write-Host "::error title=Budgets::$what :: $flat"
            & "$bin/flo.exe" service stop 2>&1 | Out-Null
            exit 1
          }
          # The budgets (D15): MiB and ms.
          $serviceBudget = 10MB
          $windowBudget = 20MB
          $startBudget = 300
          New-Item -ItemType Directory -Force -Path $env:FLOSERVER_DATA_DIR | Out-Null

          $out = & "$bin/flo.exe" service start 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Fail "flo service start (exit $LASTEXITCODE)" $out }
          Start-Sleep -Seconds 3   # idle, with an empty data folder
          $statusText = & "$bin/flo.exe" status --json 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Fail "flo status --json (exit $LASTEXITCODE)" $statusText }
          $serviceBytes = ($statusText | ConvertFrom-Json).memory_bytes
          if ($null -eq $serviceBytes) { Fail "flo status gave no memory_bytes" $statusText }

          # Three starts of the window, each to its first paint and ~2 s on.
          $runs = @()
          foreach ($i in 1..3) {
            $file = Join-Path $env:RUNNER_TEMP "measure-$i.json"
            Remove-Item $file -ErrorAction SilentlyContinue
            $p = Start-Process "$bin/FloServer.exe" -ArgumentList '--measure', "`"$file`"", '--instance', $env:FLOSERVER_INSTANCE -PassThru
            $null = $p.Handle   # kept, or ExitCode reads empty once it has gone
            if (-not $p.WaitForExit(30000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              Fail "FloServer.exe --measure (start $i) didn't close within 30 s" ""
            }
            if ($p.ExitCode -ne 0 -or -not (Test-Path $file)) {
              Fail "FloServer.exe --measure (start $i) exited with $($p.ExitCode) and no measurement" ""
            }
            $runs += Get-Content $file -Raw | ConvertFrom-Json
          }
          function Median([double[]]$values) { ($values | Sort-Object)[[int][math]::Floor($values.Count / 2)] }
          $startMs = Median ($runs | ForEach-Object { $_.first_window_ms })
          $windowBytes = Median ($runs | ForEach-Object { $_.private_bytes })
          $workingSet = Median ($runs | ForEach-Object { $_.working_set_bytes })

          $alive = (& "$bin/flo.exe" status 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Fail "the service stopped when the measured window closed" $alive }
          & "$bin/flo.exe" service stop 2>&1 | Out-Null

          "{0,-34} {1,12} {2,12}" -f "", "measured", "budget"
          "{0,-34} {1,8:N1} MiB {2,8:N1} MiB" -f "service, private bytes (idle)", ($serviceBytes / 1MB), ($serviceBudget / 1MB)
          "{0,-34} {1,8:N1} MiB {2,8:N1} MiB" -f "window, private bytes", ($windowBytes / 1MB), ($windowBudget / 1MB)
          "{0,-34} {1,8:N1} MiB {2,12}" -f "window, working set", ($workingSet / 1MB), "-"
          "{0,-34} {1,9:N0} ms {2,9:N0} ms" -f "first window shown", $startMs, $startBudget
          "runs (ms / private MiB): " + (($runs | ForEach-Object { "{0} / {1:N1}" -f $_.first_window_ms, ($_.private_bytes / 1MB) }) -join ", ")
          "::notice title=Budgets (D15)::service {0:N1} MiB idle, window {1:N1} MiB private ({2:N1} MiB working set), first window {3:N0} ms (median of 3)" -f ($serviceBytes / 1MB), ($windowBytes / 1MB), ($workingSet / 1MB), $startMs

          $broken = @()
          if ($serviceBytes -gt $serviceBudget) { $broken += "the service uses {0:N1} MiB with nothing running, over {1:N0} MiB" -f ($serviceBytes / 1MB), ($serviceBudget / 1MB) }
          if ($windowBytes -gt $windowBudget) { $broken += "the window uses {0:N1} MiB, over {1:N0} MiB" -f ($windowBytes / 1MB), ($windowBudget / 1MB) }
          if ($startMs -gt $startBudget) { $broken += "the first window took {0:N0} ms, over {1} ms" -f $startMs, $startBudget }
          foreach ($b in $broken) { "::error title=Budgets (D15)::$b" }
          if ($broken.Count -gt 0) { exit 1 }
          exit 0
      # Real downloads from cdn.floserver.org through WinHTTP, into a
      # throwaway data folder: the signed list, then nginx (a zip that needs
      # the VC++ DLLs, so `nginx -v` proves they were added), Composer (a
      # plain file) and PHP, then a project run end to end.
      - name: Install runtimes and run a project from the live CDN
        shell: pwsh
        env:
          FLOSERVER_DATA_DIR: ${{ runner.temp }}\floserver-data
          FLOSERVER_INSTANCE: ci
          FLOSERVER_WEB_PORTS: "18080,18443"
          FLOSERVER_IDLE_SECONDS: "3"
          FLOSERVER_APACHE_TRACE: "1"
        run: |
          $bin = "build/bin/Release"
          # Native programs write to stderr (nginx -v does); that isn't an error here.
          $ErrorActionPreference = "Continue"
          trap {
            Write-Host "::error title=live install::script error at line $($_.InvocationInfo.ScriptLineNumber): $($_.Exception.Message)"
            exit 1
          }
          # Logs can't be read from outside, so every failure becomes an annotation.
          function Fail([string]$what, [string]$output) {
            $what = ($what -replace "`r?`n", " | ").Trim()
            $flat = ($output -replace "`r?`n", " | ").Trim()
            if ($flat.Length -gt 3000) { $flat = $flat.Substring(0, 3000) }
            Write-Host "::error title=live install::$what :: $flat"
            exit 1
          }
          # What the service, nginx and PHP say, for a failure annotation.
          function Diagnostics() {
            $logs = "$env:FLOSERVER_DATA_DIR\web\logs"
            $out = (& "$bin/flo.exe" projects 2>&1 | Out-String)
            Get-ChildItem $logs -File -ErrorAction SilentlyContinue | ForEach-Object {
              $tail = (Get-Content $_.FullName -Tail 5 -ErrorAction SilentlyContinue) -join " / "
              if ($tail) { $out += " || $($_.Name): $tail" }
            }
            $procs = (Get-Process nginx, php-cgi, node, python, httpd -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name):$($_.Id)" }) -join ","
            return "$out || processes: $procs"
          }
          function Run([string]$what, [scriptblock]$block) {
            $out = & $block 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) { Fail "$what (exit $LASTEXITCODE)" $out }
            return $out
          }
          Run "flo runtimes" { & "$bin/flo.exe" runtimes } | Out-Null
          Run "flo install nginx" { & "$bin/flo.exe" install nginx } | Out-Null
          Run "flo install composer" { & "$bin/flo.exe" install composer } | Out-Null
          $nginx = Get-ChildItem "$env:FLOSERVER_DATA_DIR/runtimes/nginx" -Directory | Select-Object -First 1
          $files = (Get-ChildItem $nginx.FullName -File | ForEach-Object Name) -join ", "
          "nginx folder: $files"
          Run "installed nginx -v (files: $files)" { & "$($nginx.FullName)/nginx.exe" -v } | Out-Null
          $phar = Get-ChildItem "$env:FLOSERVER_DATA_DIR/runtimes/composer" -Recurse -Filter composer.phar
          if (-not $phar) {
            $all = (Get-ChildItem "$env:FLOSERVER_DATA_DIR/runtimes/composer" -Recurse | ForEach-Object Name) -join ", "
            Fail "composer.phar missing" $all
          }
          Run "flo runtimes" { & "$bin/flo.exe" runtimes } | Out-Null
          Run "flo uninstall" { & "$bin/flo.exe" uninstall composer $phar.Directory.Name } | Out-Null

          # A project served by the real nginx and php-cgi from the CDN:
          # serve, fall asleep, wake on a burst (Q1 on Windows: php-cgi gets
          # the held socket as stdin, and only that handle).
          Run "flo install php 8.5" { & "$bin/flo.exe" install php 8.5 } | Out-Null
          $site = "$env:RUNNER_TEMP\ci-shop"
          New-Item -ItemType Directory -Force "$site\public" | Out-Null
          Set-Content "$site\public\index.php" '<?php echo "shop ", PHP_VERSION, " ", $_SERVER["REQUEST_URI"];'
          Set-Content "$site\floserver.json" '{ "php": "8.5", "root": "public", "extensions": ["intl"] }'
          Run "flo add" { & "$bin/flo.exe" add $site } | Out-Null
          Run "flo start shop" { & "$bin/flo.exe" start ci-shop } | Out-Null
          $url = "http://ci-shop.localhost:18080"
          $resolve = "ci-shop.localhost:18080:127.0.0.1"
          $body = (& curl.exe -s --max-time 20 --resolve $resolve "$url/cart?x=1" | Out-String).Trim()
          if ($body -notlike "shop 8.5.* /cart?x=1") {
            Fail "first request (got '$body')" (Diagnostics)
          }
          $awake = (& "$bin/flo.exe" projects | Out-String)
          if ($awake -notmatch "on, running") { Fail "pool not running after a request" $awake }
          Start-Sleep -Seconds 8   # FLOSERVER_IDLE_SECONDS is 3
          $asleep = (& "$bin/flo.exe" projects | Out-String)
          $phpLeft = @(Get-Process php-cgi -ErrorAction SilentlyContinue).Count
          if ($asleep -notmatch "on, asleep" -or $phpLeft -ne 0) { Fail "pool didn't sleep ($phpLeft php-cgi left)" (Diagnostics) }
          # 20 requests at once while it wakes: every one is served.
          # -o applies to one URL each, so every URL gets its own.
          $targets = 1..20 | ForEach-Object { "-o"; "NUL"; "$url/burst/$_" }
          $codes = & curl.exe -s --max-time 30 --parallel --parallel-immediate --parallel-max 20 -w "%{http_code}`n" --resolve $resolve $targets
          $good = @($codes | Where-Object { $_ -eq "200" }).Count
          if ($good -ne 20) { Fail "burst while waking: $good of 20 OK ($($codes -join " "))" (Diagnostics) }
          # A second project with its own pool, added while the first runs:
          # nginx reloads (-s reload) and both are served.
          $blog = "$env:RUNNER_TEMP\\ci-blog"
          New-Item -ItemType Directory -Force $blog | Out-Null
          Set-Content "$blog\\index.php" '<?php echo "blog ", extension_loaded("intl") ? "intl" : "no-intl";'
          Set-Content "$blog\\floserver.json" '{ "php": "8.5" }'
          Run "flo add blog" { & "$bin/flo.exe" add $blog } | Out-Null
          Run "flo start blog" { & "$bin/flo.exe" start ci-blog } | Out-Null
          $blogBody = (& curl.exe -s --max-time 20 --resolve "ci-blog.localhost:18080:127.0.0.1" "http://ci-blog.localhost:18080/" | Out-String).Trim()
          $shopBody = (& curl.exe -sS --max-time 20 -w " [status %{http_code}]" --resolve $resolve "$url/again" 2>&1 | Out-String).Trim()
          $shopExit = $LASTEXITCODE
          if ($blogBody -ne "blog intl" -or $shopBody -notlike "shop 8.5.* /again*") {
            Fail "after a reload (blog '$blogBody', shop '$shopBody' curl exit $shopExit)" (Diagnostics)
          }
          # A Node project (D11): its own server, started by the first
          # request through nginx and the service's relay, asleep when idle.
          Run "flo install node 24" { & "$bin/flo.exe" install node 24 } | Out-Null
          $web = "$env:RUNNER_TEMP\ci-web"
          New-Item -ItemType Directory -Force $web | Out-Null
          Set-Content "$web\package.json" '{ "name": "ci-web", "private": true, "scripts": { "dev": "node server.js" } }'
          Set-Content "$web\server.js" 'require("http").createServer((q, r) => r.end("node " + process.version + " " + q.url)).listen(Number(process.env.PORT), process.env.HOST);'
          Set-Content "$web\floserver.json" '{ "node": "24" }'
          Run "flo add web" { & "$bin/flo.exe" add $web } | Out-Null
          Run "flo start web" { & "$bin/flo.exe" start ci-web } | Out-Null
          $webResolve = "ci-web.localhost:18080:127.0.0.1"
          $webBody = (& curl.exe -sS --max-time 60 --resolve $webResolve "http://ci-web.localhost:18080/hello" 2>&1 | Out-String).Trim()
          if ($webBody -notlike "node v24.* /hello") {
            $log = (Get-Content "$env:FLOSERVER_DATA_DIR\web\apps\ci-web.log" -Tail 20 -ErrorAction SilentlyContinue) -join " / "
            Fail "Node project (got '$webBody')" "$(Diagnostics) || app log: $log"
          }
          # nginx lets its kept-alive connections go after 10 s; then the idle time (3 s).
          $slept = $false
          for ($i = 0; $i -lt 30 -and -not $slept; $i++) {
            Start-Sleep -Seconds 1
            $slept = (& "$bin/flo.exe" projects | Out-String) -match "ci-web\s+node 24\S*\s+on, asleep"
          }
          if (-not $slept -or @(Get-Process node -ErrorAction SilentlyContinue).Count -ne 0) {
            Fail "Node project didn't sleep" (Diagnostics)
          }
          $webBody = (& curl.exe -sS --max-time 60 --resolve $webResolve "http://ci-web.localhost:18080/again" 2>&1 | Out-String).Trim()
          if ($webBody -notlike "node v24.* /again") { Fail "Node project after sleeping (got '$webBody')" (Diagnostics) }
          # A Python project (D17): FloServer makes .venv with the CDN's
          # Python, pip-installs requirements.txt from PyPI into it, then
          # runs the app from the venv; asleep when idle, woken again.
          Run "flo install python 3.13" { & "$bin/flo.exe" install python 3.13 } | Out-Null
          $api = "$env:RUNNER_TEMP\ci-api"
          New-Item -ItemType Directory -Force $api | Out-Null
          Set-Content "$api\requirements.txt" 'uvicorn'
          Set-Content "$api\main.py" @'
          import sys
          async def app(scope, receive, send):
              if scope["type"] != "http":
                  return
              body = ("python %d.%d %s venv=%s" % (sys.version_info[0], sys.version_info[1], scope["path"],
                                                  sys.prefix != sys.base_prefix)).encode()
              await send({"type": "http.response.start", "status": 200,
                          "headers": [(b"content-length", str(len(body)).encode())]})
              await send({"type": "http.response.body", "body": body})
          '@
          Set-Content "$api\floserver.json" '{ "python": "3.13", "command": "python -m uvicorn main:app --host 127.0.0.1 --port {port}" }'
          Run "flo add api" { & "$bin/flo.exe" add $api } | Out-Null
          Run "flo start api" { & "$bin/flo.exe" start ci-api } | Out-Null
          $apiResolve = "ci-api.localhost:18080:127.0.0.1"
          # The first request waits for the venv and pip.
          $apiBody = (& curl.exe -sS --max-time 400 --resolve $apiResolve "http://ci-api.localhost:18080/hello" 2>&1 | Out-String).Trim()
          if ($apiBody -ne "python 3.13 /hello venv=True") {
            $log = (Get-Content "$env:FLOSERVER_DATA_DIR\web\apps\ci-api.log" -Tail 30 -ErrorAction SilentlyContinue) -join " / "
            Fail "Python project (got '$apiBody')" "$(Diagnostics) || app log: $log"
          }
          if (-not (Test-Path "$api\.venv\Scripts\python.exe") -or -not (Test-Path "$api\.venv\.floserver-installed")) {
            Fail "Python project: .venv or its stamp is missing" (Get-ChildItem "$api\.venv" -Force | ForEach-Object Name | Out-String)
          }
          $slept = $false
          for ($i = 0; $i -lt 30 -and -not $slept; $i++) {
            Start-Sleep -Seconds 1
            $slept = (& "$bin/flo.exe" projects | Out-String) -match "ci-api\s+python 3\.13\S*\s+on, asleep"
          }
          if (-not $slept -or @(Get-Process python -ErrorAction SilentlyContinue).Count -ne 0) {
            Fail "Python project didn't sleep" (Diagnostics)
          }
          $apiBody = (& curl.exe -sS --max-time 60 --resolve $apiResolve "http://ci-api.localhost:18080/again" 2>&1 | Out-String).Trim()
          if ($apiBody -ne "python 3.13 /again venv=True") { Fail "Python project after sleeping (got '$apiBody')" (Diagnostics) }
          $pips = @(Select-String -Path "$env:FLOSERVER_DATA_DIR\web\apps\ci-api.log" -Pattern "--- FloServer: pip install" -SimpleMatch).Count
          if ($pips -ne 1) { Fail "Python project: pip ran $pips times" (Diagnostics) }
          # An Apache project (D6): WordPress's .htaccess, PHP from the pools,
          # Apache Lounge from the CDN behind nginx; asleep when idle.
          Run "flo install apache" { & "$bin/flo.exe" install apache } | Out-Null
          $wp = "$env:RUNNER_TEMP\ci-wp"
          New-Item -ItemType Directory -Force $wp | Out-Null
          Set-Content "$wp\floserver.json" '{ "web": "apache", "php": "8.5" }'
          Set-Content "$wp\.htaccess" @'
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.php$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.php [L]
          '@
          Set-Content "$wp\index.php" '<?php echo "wp ", $_SERVER["REQUEST_URI"], " ", $_SERVER["SCRIPT_NAME"], " ", $_SERVER["PATH_INFO"] ?? "-";'
          Set-Content "$wp\.env" 'SECRET=1'
          Run "flo add wp" { & "$bin/flo.exe" add $wp } | Out-Null
          Run "flo start wp" { & "$bin/flo.exe" start ci-wp } | Out-Null
          $wpResolve = "ci-wp.localhost:18080:127.0.0.1"
          $wpBody = (& curl.exe -sS --max-time 60 --resolve $wpResolve "http://ci-wp.localhost:18080/2026/10/hello/" 2>&1 | Out-String).Trim()
          if ($wpBody -ne "wp /2026/10/hello/ /index.php -") {
            $log = (Get-Content "$env:FLOSERVER_DATA_DIR\web\apps\_apache.log" -Tail 20 -ErrorAction SilentlyContinue) -join " / "
            $err = (Select-String -Path "$env:FLOSERVER_DATA_DIR\web\logs\apache-error.log" -Pattern "sending env var|AH0" -ErrorAction SilentlyContinue | Select-Object -Last 40 | ForEach-Object { $_.Line -replace '^.*\] ', '' }) -join " / "
            Fail "Apache project (got '$wpBody')" "$(Diagnostics) || runner log: $log || apache-error.log: $err"
          }
          $wpInfo = (& curl.exe -sS --max-time 30 --resolve $wpResolve "http://ci-wp.localhost:18080/index.php/a/b" 2>&1 | Out-String).Trim()
          $wpEnv = (& curl.exe -s -o NUL -w "%{http_code}" --max-time 30 --resolve $wpResolve "http://ci-wp.localhost:18080/.env" 2>&1 | Out-String).Trim()
          if ($wpInfo -ne "wp /index.php/a/b /index.php /a/b" -or $wpEnv -ne "404") {
            Fail "Apache project: path info '$wpInfo', .env status $wpEnv" (Diagnostics)
          }
          $slept = $false
          for ($i = 0; $i -lt 30 -and -not $slept; $i++) {
            Start-Sleep -Seconds 1
            $slept = @(Get-Process httpd -ErrorAction SilentlyContinue).Count -eq 0
          }
          if (-not $slept) { Fail "Apache didn't sleep" (Diagnostics) }
          $wpBody = (& curl.exe -sS --max-time 60 --resolve $wpResolve "http://ci-wp.localhost:18080/again" 2>&1 | Out-String).Trim()
          if ($wpBody -ne "wp /again /index.php -") { Fail "Apache project after sleeping (got '$wpBody')" (Diagnostics) }
          # A folder with a space and non-ASCII letters, as C:\Users\Jörg Müller\... is:
          # a PHP project on nginx and one on Apache.
          $uni = "$env:RUNNER_TEMP\Jörg Müller"
          New-Item -ItemType Directory -Force "$uni\ci-uni", "$uni\ci-wpu" | Out-Null
          Set-Content "$uni\ci-uni\index.php" '<?php echo "uni ", basename(__DIR__);'
          Set-Content "$uni\ci-uni\floserver.json" '{ "php": "8.5" }'
          Copy-Item "$wp\.htaccess", "$wp\index.php", "$wp\floserver.json" "$uni\ci-wpu\"
          Run "flo add uni" { & "$bin/flo.exe" add "$uni\ci-uni" } | Out-Null
          Run "flo add wpu" { & "$bin/flo.exe" add "$uni\ci-wpu" } | Out-Null
          Run "flo start uni" { & "$bin/flo.exe" start ci-uni } | Out-Null
          Run "flo start wpu" { & "$bin/flo.exe" start ci-wpu } | Out-Null
          $uniBody = (& curl.exe -sS --max-time 60 --resolve "ci-uni.localhost:18080:127.0.0.1" "http://ci-uni.localhost:18080/" 2>&1 | Out-String).Trim()
          $wpuBody = (& curl.exe -sS --max-time 60 --resolve "ci-wpu.localhost:18080:127.0.0.1" "http://ci-wpu.localhost:18080/x/" 2>&1 | Out-String).Trim()
          if ($uniBody -ne "uni ci-uni" -or $wpuBody -ne "wp /x/ /index.php -") {
            Fail "non-ASCII folder: nginx PHP project got '$uniBody', Apache project got '$wpuBody'" (Diagnostics)
          }
          # Shared sites (D19): a www folder at localhost/<folder>/ and <folder>.localhost, through Apache,
          # then through nginx.
          $www = "$env:RUNNER_TEMP\ci-www"
          New-Item -ItemType Directory -Force "$www\notes", "$www\plain" | Out-Null
          Set-Content "$www\notes\index.php" '<?php echo "notes ", $_SERVER["SCRIPT_NAME"];'
          Set-Content "$www\plain\index.html" 'plain html'
          Run "flo shared dir" { & "$bin/flo.exe" shared dir $www } | Out-Null
          foreach ($webServer in "apache", "nginx") {
            Run "flo shared web $webServer" { & "$bin/flo.exe" shared web $webServer } | Out-Null
            Run "flo shared on" { & "$bin/flo.exe" shared on } | Out-Null
            $listBody = (& curl.exe -sS --max-time 60 --resolve "localhost:18080:127.0.0.1" "http://localhost:18080/" 2>&1 | Out-String)
            $pathBody = (& curl.exe -sS --max-time 60 --resolve "localhost:18080:127.0.0.1" "http://localhost:18080/notes/" 2>&1 | Out-String).Trim()
            $hostBody = (& curl.exe -sS --max-time 60 --resolve "notes.localhost:18080:127.0.0.1" "http://notes.localhost:18080/" 2>&1 | Out-String).Trim()
            $plainBody = (& curl.exe -sS --max-time 60 --resolve "plain.localhost:18080:127.0.0.1" "http://plain.localhost:18080/" 2>&1 | Out-String).Trim()
            if ($listBody -notlike "*Shared sites*notes/*" -or $pathBody -ne "notes /notes/index.php" -or
                $hostBody -ne "notes /index.php" -or $plainBody -ne "plain html") {
              Fail "shared sites ($webServer)" "list: $listBody || path: $pathBody || host: $hostBody || plain: $plainBody || $(& "$bin/flo.exe" shared 2>&1 | Out-String) || $(Diagnostics)"
            }
          }
          Run "flo shared off" { & "$bin/flo.exe" shared off } | Out-Null
          # The terminal shims (D10): each runs the project's own version.
          Run "flo install composer" { & "$bin/flo.exe" install composer } | Out-Null  # uninstalled above
          Run "flo shims install" { & "$bin/flo.exe" shims install } | Out-Null
          $shims = "$env:FLOSERVER_DATA_DIR\shims"
          $reg = (Get-ItemProperty HKCU:\Environment).Path
          if ($reg -notlike "*$shims*") { Fail "flo shims install didn't put the shims on the user's Path" $reg }
          Push-Location "$env:RUNNER_TEMP\ci-shop"
          $phpOut = (& "$shims\php.exe" -r 'echo PHP_VERSION, " ", extension_loaded("intl") ? "intl" : "no-intl", " ", basename(php_ini_loaded_file());' 2>&1 | Out-String).Trim()
          $composerOut = (& "$shims\composer.exe" --version 2>&1 | Out-String).Trim()
          Pop-Location
          Push-Location "$env:RUNNER_TEMP\ci-web"
          $nodeOut = (& "$shims\node.exe" -e "console.log(process.version, process.argv.slice(1).join('|'))" "a b" c 2>&1 | Out-String).Trim()
          $npmOut = (& "$shims\npm.exe" --version 2>&1 | Out-String).Trim()
          Pop-Location
          Push-Location "$env:RUNNER_TEMP\ci-api"
          $pyOut = (& "$shims\python.exe" -c "import sys; print(sys.prefix != sys.base_prefix, sys.version_info[:2])" 2>&1 | Out-String).Trim()
          $pipOut = (& "$shims\pip.exe" --version 2>&1 | Out-String).Trim()
          Pop-Location
          if ($phpOut -notlike "8.5.* intl 8.5.*.ini" -or $composerOut -notlike "Composer version *" -or
              $nodeOut -notlike "v24.* a b|c" -or $npmOut -notmatch "^\d+\.\d+" -or
              $pyOut -ne "True (3, 13)" -or $pipOut -notlike "pip *ci-api*") {
            Fail "shims" "php: $phpOut || composer: $composerOut || node: $nodeOut || npm: $npmOut || python: $pyOut || pip: $pipOut"
          }
          Run "flo shims remove" { & "$bin/flo.exe" shims remove } | Out-Null
          Run "flo stop" { & "$bin/flo.exe" stop } | Out-Null
          Start-Sleep -Seconds 1
          $left = @(Get-Process nginx, php-cgi, node, python, httpd -ErrorAction SilentlyContinue).Count
          if ($left -ne 0) { Fail "processes left after flo stop" (Diagnostics) }
          "::notice title=live install::nginx, Composer, PHP and Node installed from the CDN; a project served, slept and woke for 20 requests at once; a second pool added with a reload; a Node project served, slept and woke; a Python project got its .venv and packages, served, slept and woke; an Apache project served with .htaccess rewrites, slept and woke; shared sites served through Apache and nginx; the shims ran each project's php, composer, node, npm, python and pip"
          exit 0
      # The build, for trying on a real PC: download it from the run's page.
      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FloServer-windows-x64-${{ github.sha }}
          # FloServer-Setup.exe has no MSI inside yet here: it's built below, after the MSI.
          path: |
            build/bin/Release/*.exe
            build/bin/Release/*.dll
            !build/bin/Release/FloServer-Setup.exe
          retention-days: 14
      # The installer (D21): WiX 5, pinned (WiX 6+ asks companies that earn
      # money with it for a fee). Built from the Release programs above.
      - name: Build the installer (MSI)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2 | Out-Null
          wix extension add --global WixToolset.UI.wixext/5.0.2 | Out-Null
          wix extension add --global WixToolset.Util.wixext/5.0.2 | Out-Null
          # The version in project(FloServer VERSION x.y.z ...), not the first VERSION in the file.
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(FloServer\s+VERSION\s+(\d+\.\d+\.\d+)').Groups[1].Value
          if (-not $version) { "::error title=MSI::no version in CMakeLists.txt's project()"; exit 1 }
          $msi = "FloServer-$version-x64.msi"
          # What ships, laid out as installed (see installer/FloServer.wxs).
          $stage = Join-Path $env:RUNNER_TEMP 'msi-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($f in 'FloServer.exe', 'floserverd.exe', 'flo.exe', 'floserver-shim.exe') {
            Copy-Item (Join-Path 'build/bin/Release' $f) $stage
          }
          Copy-Item build/bin/Release/*.dll $stage
          Get-ChildItem $stage -Recurse -File | ForEach-Object { "  {0,-40} {1,10:N0} bytes" -f $_.FullName.Substring($stage.Length + 1), $_.Length }
          wix build installer/FloServer.wxs -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -arch x64 `
            -d Version=$version -d StageDir=$stage -o $msi 2>&1 | Tee-Object -FilePath wix.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content wix.log | Select-String 'error|warning' | Select-Object -First 20 |
              ForEach-Object { "::error title=WiX::$($_.Line.Trim())" }
            exit 1
          }
          $bytes = (Get-Item $msi).Length
          "{0}: {1:N0} bytes ({2:N1} MB)" -f $msi, $bytes, ($bytes / 1MB)
          # D15: above 15 MB is an alarm to look at, not a failed PR.
          if ($bytes -gt 15MB) { "::warning title=Installer size::$msi is {0:N1} MB, above the 15 MB alarm (D15)" -f ($bytes / 1MB) }
          "MSI=$msi" | Out-File -FilePath $env:GITHUB_ENV -Append
      # Install it as an ordinary user would (per user, no admin), check what
      # it put where, uninstall it, and check it all went.
      - name: Install and uninstall the MSI
        shell: pwsh
        run: |
          function Fail($what) { "::error title=MSI::$what"; exit 1 }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\FloServer'
          $proc = Start-Process msiexec -ArgumentList '/i', $env:MSI, '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { Get-Content install.log -Tail 40; Fail "install exited with $($proc.ExitCode)" }
          foreach ($f in 'FloServer.exe', 'floserverd.exe', 'flo.exe', 'floserver-shim.exe', 'floserver-setup.dll', 'vcruntime140.dll') {
            if (-not (Test-Path (Join-Path $dir $f))) { Fail "$f isn't in $dir" }
          }
          if (Test-Path (Join-Path $dir 'FloServer-Setup.exe')) { Fail "the setup program was installed" }
          # D25: FloServer's own entry in Settings -> Apps opens its Uninstall window.
          $arp = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\FloServer'
          $entry = Get-ItemProperty $arp -ErrorAction SilentlyContinue
          if (-not $entry) { Fail "no FloServer entry under $arp" }
          if ($entry.UninstallString -ne ('"' + (Join-Path $dir 'FloServer.exe') + '" --uninstall')) { Fail "its UninstallString is '$($entry.UninstallString)'" }
          if ($entry.QuietUninstallString -notmatch '^MsiExec\.exe /X\{[0-9A-F-]{36}\} /qn$') { Fail "its QuietUninstallString is '$($entry.QuietUninstallString)'" }
          if ($entry.Publisher -ne 'HostKurd' -or -not $entry.DisplayVersion) { Fail "its Publisher or DisplayVersion is missing" }
          if (Test-Path (Join-Path $dir 'vcruntime')) { Fail "a second copy of the Visual C++ runtime (vcruntime\) was installed" }
          if (Test-Path (Join-Path $dir 'floserver-publisher.exe')) { Fail "the Publisher (HostKurd's tool) was installed" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $dir -and ($userPath -split ';') -notcontains "$dir\") { Fail "$dir isn't on the user's Path: $userPath" }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'FloServer.lnk'
          if (-not (Test-Path $shortcut)) { Fail "no Start menu shortcut at $shortcut" }
          # FloServer.exe must be the window, not the CLI (they once shared a name).
          if ((Get-Item (Join-Path $dir 'FloServer.exe')).VersionInfo.FileName -and
              (Get-FileHash (Join-Path $dir 'FloServer.exe')).Hash -eq (Get-FileHash (Join-Path $dir 'flo.exe')).Hash) {
            Fail "FloServer.exe is the same program as flo.exe"
          }
          if ((Get-Item HKCU:\Environment).GetValueKind('Path') -ne 'ExpandString') {
            Fail "the user's Path is no longer REG_EXPAND_SZ after installing"
          }
          $version = (& (Join-Path $dir 'flo.exe') version 2>&1 | Out-String).Trim()
          "installed: $version"
          if (-not $version) { Fail "flo version printed nothing" }
          # A running service must be stopped by the uninstall, or its files stay.
          & (Join-Path $dir 'flo.exe') service start | Out-Null
          if (-not (Get-Process floserverd -ErrorAction SilentlyContinue)) { Fail "flo service start didn't start floserverd" }
          $proc = Start-Process msiexec -ArgumentList '/x', $env:MSI, '/qn', '/l*v', 'uninstall.log' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { Get-Content uninstall.log -Tail 40; Fail "uninstall exited with $($proc.ExitCode)" }
          if (Get-Process floserverd -ErrorAction SilentlyContinue) { Fail "floserverd is still running after uninstalling" }
          if (Test-Path $dir) { Fail "$dir is still there after uninstalling: $((Get-ChildItem $dir -Recurse).FullName -join ', ')" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ((($userPath -split ';') -contains $dir) -or (($userPath -split ';') -contains "$dir\")) { Fail "$dir is still on the user's Path" }
          if (Test-Path $shortcut) { Fail "the Start menu shortcut is still there" }
          if (Test-Path $arp) { Fail "FloServer's Settings -> Apps entry is still there" }
          "::notice title=MSI::$env:MSI installed per user without admin, ran flo and the service, and uninstalled cleanly (service stopped, files, Path entry and shortcut gone)"
      # D25: FloServer-Setup-<version>.exe, the download: a small launcher
      # carrying floserver-setup.dll and the MSI above. Built now that the MSI
      # exists, then installed with --quiet as CI and companies would, run
      # again over itself (the same build: installed again), and removed.
      - name: Build the setup program
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(FloServer\s+VERSION\s+(\d+\.\d+\.\d+)').Groups[1].Value
          cmake -S . -B build -A x64 "-DFLOSERVER_SETUP_MSI=$((Resolve-Path $env:MSI).Path)" | Out-Null
          cmake --build build --config Release --target floserver_setup 2>&1 | Tee-Object -FilePath setup-build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content setup-build.log | Select-String ': (fatal )?error ' | Select-Object -First 20 |
              ForEach-Object { "::error title=Setup::$($_.Line.Trim())" }
            exit 1
          }
          $setup = "FloServer-Setup-$version.exe"
          Copy-Item build/bin/Release/FloServer-Setup.exe $setup
          $bytes = (Get-Item $setup).Length
          "{0}: {1:N0} bytes ({2:N1} MB); floserver-setup.dll {3:N0} bytes" -f $setup, $bytes, ($bytes / 1MB), (Get-Item build/bin/Release/floserver-setup.dll).Length
          if ($bytes -gt 15MB) { "::warning title=Installer size::$setup is {0:N1} MB, above the 15 MB alarm (D15)" -f ($bytes / 1MB) }
          # Only Windows' own DLLs: it must start on a PC without the Visual C++ runtime.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { "::error title=Setup::dumpbin.exe not found"; exit 1 }
          foreach ($f in $setup, 'build/bin/Release/floserver-setup.dll') {
            $deps = & $dumpbin /dependents $f | Select-String '\.dll' | ForEach-Object { $_.Line.Trim() }
            $bad = $deps | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt)' }
            if ($bad) { "::error title=Setup::$f needs the Visual C++ runtime: $($bad -join ', ')"; exit 1 }
          }
          "SETUP=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install, install again and remove with the setup program
        shell: pwsh
        run: |
          function Fail($what) { "::error title=Setup::$what"; exit 1 }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\FloServer'
          $arp = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\FloServer'
          foreach ($round in 'install', 'install again') {
            $proc = Start-Process ".\$env:SETUP" -ArgumentList '--quiet', '--log', "$PWD\setup-$($round -replace ' ', '-').log" -Wait -PassThru
            if ($proc.ExitCode -ne 0) { Get-Content "setup-$($round -replace ' ', '-').log" -Tail 40; Fail "$round exited with $($proc.ExitCode)" }
            foreach ($f in 'FloServer.exe', 'floserverd.exe', 'flo.exe', 'floserver-setup.dll') {
              if (-not (Test-Path (Join-Path $dir $f))) { Fail "after '$round', $f isn't in $dir" }
            }
            if (-not (Test-Path $arp)) { Fail "after '$round', no FloServer entry in Settings -> Apps" }
          }
          $accepted = (Get-ItemProperty 'HKCU:\Software\HostKurd\FloServer' -ErrorAction SilentlyContinue).AcceptedLicence
          if ($accepted -notmatch '^[0-9a-f]{64}$') { Fail "the accepted licence wasn't noted: '$accepted'" }
          # No setup files left in %TEMP%.
          $left = @(Get-ChildItem $env:TEMP -Directory -Filter 'FloServer-setup-*' -ErrorAction SilentlyContinue)
          if ($left.Count -ne 0) { Fail "the setup left $($left.Count) folder(s) in %TEMP%" }
          # Removed as tools that remove programs silently do: QuietUninstallString.
          $quiet = (Get-ItemProperty $arp).QuietUninstallString
          $exe, $rest = $quiet -split ' ', 2
          $proc = Start-Process $exe -ArgumentList $rest -Wait -PassThru
          if ($proc.ExitCode -ne 0) { Fail "'$quiet' exited with $($proc.ExitCode)" }
          if (Test-Path $dir) { Fail "$dir is still there after removing" }
          if (Test-Path $arp) { Fail "FloServer's Settings -> Apps entry is still there after removing" }
          if ((Get-ItemProperty 'HKCU:\Software\HostKurd\FloServer' -ErrorAction SilentlyContinue).AcceptedLicence) { Fail "the accepted licence is still noted after removing" }
          "::notice title=Setup::$env:SETUP installed FloServer quietly without admin, installed it again over itself, and it was removed cleanly"
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: FloServer-installer-${{ github.sha }}
          path: |
            FloServer-*-x64.msi
            FloServer-Setup-*.exe
          retention-days: 14

  linux-sanitizers:
    name: Linux (clang, ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev libssl-dev nginx-core php-cgi apache2 mariadb-server && (sudo systemctl stop mariadb apache2 || true)
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DFLOSERVER_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee test.log
      # Job logs can't be read from every place the team works; the
      # failing lines become annotations on the run.
      - name: Show failed tests as annotations
        if: failure()
        shell: bash
        run: |
          grep -E 'TEST CASE|ERROR|FATAL|values:|logged:|runtime error|Sanitizer|SUMMARY|AH[0-9]{5}|--- FloServer' test.log | head -60 |
            while IFS= read -r line; do echo "::error title=floserver_tests::${line}"; done

  linux-release:
    name: Linux (GCC, release)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev nginx-core php-cgi apache2 mariadb-server && (sudo systemctl stop mariadb apache2 || true)
      # Optimised builds turn on warnings the debug builds don't (FORTIFY).
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee test.log
      # Job logs can't be read from every place the team works; the
      # failing lines become annotations on the run.
      - name: Show failed tests as annotations
        if: failure()
        shell: bash
        run: |
          grep -E 'TEST CASE|ERROR|FATAL|values:|logged:|runtime error|Sanitizer|SUMMARY|AH[0-9]{5}|--- FloServer' test.log | head -60 |
            while IFS= read -r line; do echo "::error title=floserver_tests::${line}"; done

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 clang-tidy-18 libssl-dev
      # Files whose preprocessed source, checks and clang-tidy version are
      # unchanged since they last passed aren't checked again
      # (tools/ci/clang_tidy_cache.py). Each run saves its own cache and
      # starts from the newest one this branch or main can see.
      - name: Restore clang-tidy passes
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/clang-tidy-cache
          key: clang-tidy-18-${{ github.sha }}
          restore-keys: clang-tidy-18-
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DFLOSERVER_CLANG_TIDY=ON -DFLOSERVER_CLANG_TIDY_CACHE=ON
      - name: Build with clang-tidy
        env:
          FLOSERVER_CLANG_TIDY_CACHE_DIR: ${{ runner.temp }}/clang-tidy-cache
        run: |
          mkdir -p "$FLOSERVER_CLANG_TIDY_CACHE_DIR"
          find "$FLOSERVER_CLANG_TIDY_CACHE_DIR" -type f -mtime +14 -delete
          set -o pipefail
          cmake --build build 2>&1 | tee build.log
          echo "clang-tidy cache: $(find "$FLOSERVER_CLANG_TIDY_CACHE_DIR" -type f | wc -l) passing files"
      - name: Show clang-tidy findings as annotations
        if: failure()
        shell: bash
        run: |
          grep -E 'error:|FAILED:' build.log | sort -u | head -30 |
            while IFS= read -r line; do echo "::error title=clang-tidy::${line}"; done
      # Saved after a failure too: a marker only ever means "passed".
      - name: Save clang-tidy passes
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/clang-tidy-cache
          key: clang-tidy-18-${{ github.sha }}

  windows-cross:
    name: Windows code builds with MinGW
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        # An Ubuntu mirror that stops answering held this step until the job's
        # 30-minute limit (twice on 5-6 Nov): each try is time-limited, with
        # network timeouts, and tried up to three times.
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for try in 1 2 3; do
            if timeout 300 sudo apt-get $apt_opts update &&
               timeout 300 sudo apt-get $apt_opts install -y ninja-build mingw-w64; then
              exit 0
            fi
            echo "::warning title=apt::try $try didn't finish; trying again"
            sleep 10
          done
          exit 1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake
      - name: Build
        run: cmake --build build
